<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nieve España · previsión de esquí</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8;
          --accent:#38bdf8; --warn:#fbbf24; --ok:#4ade80; --bad:#f87171; --sheet-h:50vh; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #map { position:absolute; inset:0; }
  #particles { position:absolute; inset:0; z-index:1; pointer-events:none; }
  .glass { background:rgba(15,23,42,.9); color:var(--text); border-radius:12px; backdrop-filter:blur(6px); }
  button { font-family:inherit; }

  .topbar { position:absolute; top:12px; left:12px; z-index:2; padding:10px 12px; max-width:calc(100% - 64px); }
  .topbar h1 { margin:0 0 8px; font-size:15px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .seg { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .seg .lab { font-size:11px; color:var(--muted); align-self:center; margin-right:2px; }
  .seg button, .pill { background:var(--card); border:0; color:var(--muted); padding:6px 10px; border-radius:8px; cursor:pointer; font-size:12.5px; }
  .seg button.on { background:var(--accent); color:#0f172a; font-weight:600; }
  .pill.rank { background:#fbbf24; color:#0f172a; font-weight:600; }

  .legend { position:absolute; left:12px; bottom:112px; z-index:2; padding:8px 10px; font-size:11.5px; width:240px; transition:bottom .3s; }
  .legend .bar { height:10px; border-radius:5px; margin:6px 0 3px; }
  .legend .ticks { display:flex; justify-content:space-between; color:var(--muted); }
  .readout { position:absolute; right:12px; bottom:112px; z-index:2; padding:8px 10px; font-size:12.5px; display:none; transition:bottom .3s; }

  .timebar { position:absolute; left:12px; right:12px; bottom:14px; z-index:3; padding:10px 12px; max-width:860px; margin:0 auto; transition:bottom .3s; }
  .time-row { display:flex; align-items:center; gap:10px; }
  .play { width:36px; height:36px; border-radius:50%; border:0; background:var(--accent); color:#0f172a; font-size:14px; cursor:pointer; flex:none; }
  input[type=range] { flex:1; accent-color:var(--accent); }
  .tlabel { min-width:150px; text-align:right; font-size:13px; font-weight:600; }
  .tlabel .trend { display:block; font-weight:400; font-size:11px; color:var(--warn); }
  .days { display:flex; gap:4px; margin-top:6px; overflow-x:auto; }
  .days button { flex:1; min-width:48px; background:var(--card); border:0; color:var(--muted); padding:4px 6px; border-radius:6px; cursor:pointer; font-size:12px; }
  .days button.on { color:var(--text); outline:1px solid var(--accent); }

  .banner { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:6; padding:10px 14px; max-width:min(560px,92%); font-size:13px; display:none; border:1px solid var(--warn); }
  .banner button { margin-left:8px; background:var(--warn); border:0; border-radius:6px; padding:4px 10px; cursor:pointer; font-weight:600; }

  /* Hoja inferior (como Windy) */
  .sheet { position:absolute; left:0; right:0; bottom:0; height:var(--sheet-h); z-index:4; background:var(--bg); color:var(--text);
           border-radius:16px 16px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.4); transform:translateY(100%); transition:transform .3s ease;
           display:flex; flex-direction:column; }
  .sheet.open { transform:translateY(0); }
  body.sheet-open .timebar { bottom:calc(var(--sheet-h) + 8px); }
  body.sheet-open .legend, body.sheet-open .readout { bottom:calc(var(--sheet-h) + 108px); }
  .sheet-top { display:flex; align-items:center; gap:10px; padding:8px 14px 0; }
  .handle { width:44px; height:5px; border-radius:3px; background:var(--line); margin:6px auto 0; }
  .sheet-close { margin-left:auto; background:none; border:0; color:var(--muted); font-size:26px; cursor:pointer; line-height:1; }
  .sheet-body { overflow-y:auto; padding:4px 14px 18px; flex:1; }
  .sheet h2 { margin:0; font-size:20px; }
  .sheet h3 { font-size:11.5px; color:var(--muted); font-weight:600; margin:14px 0 6px; text-transform:uppercase; letter-spacing:.05em; }
  .sub { color:var(--muted); font-size:12px; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; margin:4px 6px 0 0; }
  .b-warn,.b-mid { background:rgba(251,191,36,.15); color:var(--warn); }
  .b-ok { background:rgba(74,222,128,.15); color:var(--ok); }
  .b-bad { background:rgba(248,113,113,.15); color:var(--bad); }
  .tabs { display:flex; gap:4px; margin:10px 0 0; flex-wrap:wrap; }
  .tabs button { background:var(--card); border:0; color:var(--muted); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12.5px; }
  .tabs button.on { background:var(--accent); color:#0f172a; font-weight:600; }

  .daycards { display:flex; gap:6px; overflow-x:auto; margin-top:10px; padding-bottom:2px; }
  .dc { flex:1; min-width:86px; background:var(--card); border-radius:10px; padding:8px; cursor:pointer; text-align:center; font-size:12px; border:1px solid transparent; }
  .dc.on { border-color:var(--accent); }
  .dc .score { font-size:20px; font-weight:700; margin:3px 0; }
  .dc.trend { opacity:.7; }

  .tablewrap { overflow-x:auto; margin-top:10px; border-radius:10px; border:1px solid var(--line); }
  table.wx { border-collapse:collapse; font-size:12px; white-space:nowrap; }
  table.wx th, table.wx td { padding:4px 5px; text-align:center; min-width:40px; }
  table.wx td { border-top:1px solid var(--line); }
  table.wx .rowh { position:sticky; left:0; background:var(--card); text-align:left; color:var(--muted); font-weight:500; z-index:1; min-width:96px; }
  table.wx thead th { background:var(--card); }
  table.wx .dayh { color:var(--text); font-weight:600; border-left:2px solid var(--line); text-align:left; }
  table.wx .dstart { border-left:2px solid var(--line); }
  table.wx .trend { opacity:.55; }
  .arrow { display:inline-block; }

  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card { background:var(--card); border-radius:12px; padding:10px 12px; }
  .model-row { display:grid; grid-template-columns:150px 1fr 50px; align-items:center; gap:8px; font-size:12.5px; margin:6px 0; }
  .model-bar { height:9px; border-radius:5px; }
  .model-val { text-align:right; font-weight:600; }
  .prob { display:grid; grid-template-columns:70px 1fr 42px; gap:8px; align-items:center; font-size:12.5px; margin:5px 0; }
  .prob .track { height:9px; background:#0f172a; border-radius:5px; overflow:hidden; }
  .prob .fill { height:100%; background:var(--accent); }
  .note { font-size:12px; color:var(--muted); line-height:1.5; margin-top:12px; }

  .chips { display:flex; gap:4px; flex-wrap:wrap; margin-top:8px; }
  .chips button { background:var(--card); border:0; color:var(--muted); padding:5px 10px; border-radius:999px; cursor:pointer; font-size:12px; }
  .chips button.on { background:var(--accent); color:#0f172a; font-weight:600; }
  table.rank { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  table.rank th { color:var(--muted); font-weight:500; font-size:11.5px; text-align:left; padding:6px; }
  table.rank td { padding:7px 6px; border-top:1px solid var(--line); }
  table.rank tr.row { cursor:pointer; } table.rank tr.row:hover td { background:var(--card); }
  .sc { display:inline-block; min-width:38px; text-align:center; border-radius:6px; padding:2px 6px; font-weight:700; color:#0f172a; }

  @media (max-width:700px) {
    :root { --sheet-h:62vh; }
    .legend { width:180px; bottom:128px; }
    .readout { bottom:176px; }
    body.sheet-open .legend, body.sheet-open .readout { display:none; }
    .tlabel { min-width:96px; font-size:12px; }
    .grid2 { grid-template-columns:1fr; }
    .model-row { grid-template-columns:110px 1fr 46px; }
    .hide-m { display:none; }
  }

  .status-line { font-size:11.5px; color:var(--muted); margin-top:6px; cursor:pointer; }
  .status-line b { color:var(--text); font-weight:600; }
  .vrow { display:grid; grid-template-columns:150px 1fr 1fr 40px; gap:8px; font-size:12.5px; margin:5px 0; }
  .vrow.head { color:var(--muted); font-size:11px; }
  @media (max-width:700px) { .vrow { grid-template-columns:110px 1fr 1fr 34px; } }
</style>
</head>
<body>
<div id="map"></div>
<canvas id="particles"></canvas>

<div class="topbar glass">
  <h1>❄️ Nieve España <button class="pill rank" id="btn-rank">🏆 ¿Dónde esquiar?</button></h1>
  <div class="seg" id="layers">
    <span class="lab">Capa</span>
    <button data-layer="snow" class="on">Nieve nueva</button>
    <button data-layer="temp">Temperatura</button>
    <button data-layer="wind">Viento</button>
    <button data-layer="fl">Isocero</button>
    <button id="toggle-particles" class="on">Partículas</button>
  </div>
  <div class="seg" id="dots">
    <span class="lab">Estaciones</span>
    <button data-dots="snow" class="on">Nieve</button>
    <button data-dots="score">Índice de esquí</button>
  </div>
  <div class="status-line" id="status-line">Cargando datos…</div>
</div>

<div class="banner glass" id="banner"></div>
<div class="legend glass" id="legend">Cargando…</div>
<div class="readout glass" id="readout"></div>

<div class="timebar glass">
  <div class="time-row">
    <button class="play" id="play" aria-label="Reproducir">▶</button>
    <input type="range" id="slider" min="0" max="0" value="0">
    <div class="tlabel" id="tlabel">Cargando…</div>
  </div>
  <div class="days" id="days"></div>
</div>

<section class="sheet" id="sheet">
  <div class="handle"></div>
  <div class="sheet-top"><div id="sheet-title"></div><button class="sheet-close" id="sheet-close" aria-label="Cerrar">×</button></div>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<script>
/* =====================================================================
   NIEVE ESPAÑA · web
   Esta página NO llama a ningún servicio meteorológico: lee los archivos
   que prepara el programa backend/build.py cada 12 horas en GitHub Actions.
   Datos: ECMWF Open Data (CC BY 4.0), Open-Meteo, AEMET (verificación).
   ===================================================================== */
const ELEV = [["top", "Cima"], ["ref", "Media"], ["base", "Base"]];
const ZONES = ["Pirineos", "Cantábrica", "Central", "Ibérico", "Penibético"];
let STATIONS = [], MODELS = [], TIME = [], TIDX = new Map(), NOW = 0, META = null, VERIFS = null;

const SCALES = {
  snow: { title:"Nieve nueva desde ahora (cm)", stops:[[0,[186,230,253]],[5,[56,189,248]],[15,[37,99,235]],[30,[124,58,237]],[60,[219,39,119]],[100,[251,207,232]]], ticks:[0,5,15,30,60,100] },
  temp: { title:"Temperatura a 2 m (°C)", stops:[[-20,[91,42,134]],[-10,[59,91,219]],[-2,[116,192,252]],[0,[200,230,255]],[2,[105,219,124]],[10,[192,235,117]],[20,[255,212,59]],[30,[247,103,7]],[40,[201,42,42]]], ticks:[-20,-10,0,10,20,30,40] },
  wind: { title:"Viento a 10 m (km/h)", stops:[[0,[59,91,219]],[15,[21,170,191]],[30,[64,192,87]],[50,[250,176,5]],[70,[247,103,7]],[100,[194,37,92]]], ticks:[0,15,30,50,70,100] },
  fl:   { title:"Isocero: altura de 0 °C (m)", stops:[[0,[91,42,134]],[500,[59,91,219]],[1000,[56,189,248]],[1500,[134,239,172]],[2000,[250,204,21]],[2500,[249,115,22]],[3000,[220,38,38]],[4000,[127,29,29]]], ticks:[0,1000,2000,3000,4000] },
};
const SNOW_DOTS = [[0,"#94a3b8"],[1,"#bae6fd"],[5,"#38bdf8"],[15,"#2563eb"],[30,"#7c3aed"],[60,"#db2777"]];
const SCORE_COLORS = [[0,"#f87171"],[3.5,"#fbbf24"],[5.5,"#a3e635"],[7.5,"#22c55e"]];

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const fmt = (v, d = 0) => (v == null || isNaN(v) ? "—" : Number(v).toFixed(d));
const DAYS = ["dom","lun","mar","mié","jue","vie","sáb"];
const dayName = iso => DAYS[new Date(iso.slice(0, 10) + "T12:00").getDay()];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function nowKey() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`; }
function scoreColor(v) { let c = SCORE_COLORS[0][1]; for (const [t, col] of SCORE_COLORS) if (v >= t) c = col; return c; }
function scoreLabel(v) { return v >= 7.5 ? "Día top" : v >= 5.5 ? "Bueno" : v >= 3.5 ? "Regular" : "Malo"; }
const sumRange = (a, i0, i1) => { let s = 0; for (let i = Math.max(0, i0); i <= i1 && i < a.length; i++) s += a[i] || 0; return s; };
const hoursAgo = iso => (Date.now() - Date.parse(iso)) / 3600e3;
function banner(msg) { const b = $("banner"); b.style.display = msg ? "block" : "none"; b.innerHTML = msg || ""; }
async function getFile(path, type = "json") {
  const r = await fetch(path, { cache: "no-cache" });
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return type === "json" ? r.json() : r.arrayBuffer();
}
function colorAt(scale, v) {
  const s = scale.stops; if (v <= s[0][0]) return s[0][1];
  for (let i = 1; i < s.length; i++) if (v <= s[i][0]) { const [v0, c0] = s[i-1], [v1, c1] = s[i], f = (v - v0) / (v1 - v0); return [0,1,2].map(k => Math.round(c0[k] + (c1[k] - c0[k]) * f)); }
  return s[s.length - 1][1];
}

/* =====================================================================
   1) DATOS DE LAS ESTACIONES (data/stations.json)
   ===================================================================== */
function prepareStations(D) {
  TIME = D.time; TIDX = new Map(TIME.map((t, i) => [t, i]));
  const nk = nowKey(); NOW = TIDX.has(nk) ? TIDX.get(nk) : Math.max(0, TIME.findIndex(t => t >= nk));
  MODELS = D.sources; STATIONS = D.stations;
  STATIONS.forEach(s => {
    const snow = s.el[1].b.snow; let acc = 0;
    s.cumSnow = TIME.map((_, t) => { if (t > NOW) acc += snow[t] || 0; return t > NOW ? acc : 0; });
    s.recent48 = sumRange(snow, NOW - 47, NOW);
    s.models = Object.keys(s.el[0].per);
  });
}

/* Índice de esquí (0-10) para un día: orientativo */
function dayScore(s, date) {
  const i9 = TIDX.get(date + "T09:00"), i16 = TIDX.get(date + "T16:00");
  if (i9 == null || i16 == null) return null;
  const top = s.el[0].b, mid = s.el[1].b, base = s.el[2].b;
  const fresh = sumRange(mid.snow, i9 - 48, i9);
  const daySnow = sumRange(mid.snow, i9 + 1, i16), rain = sumRange(mid.rain, i9 + 1, i16);
  const slice = (a, f) => { const v = a.slice(i9, i16 + 1).filter(x => x != null); return v.length ? f(v) : null; };
  const cloud = slice(mid.cloud, v => v.reduce((a, b) => a + b, 0) / v.length);
  const gust = slice(top.gust, v => Math.max(...v)) ?? slice(top.wind, v => Math.max(...v) * 1.5);
  const tmaxBase = slice(base.temp, v => Math.max(...v)), tminTop = slice(top.temp, v => Math.min(...v));
  let sc = 3 + Math.min(4, fresh / 7.5);
  if (cloud != null) sc += cloud < 30 ? 2 : cloud < 60 ? 1 : cloud > 85 ? -0.5 : 0;
  if (daySnow > 8) sc -= 0.5;
  if (rain > 1) sc -= 2.5;
  if (gust != null) sc -= gust > 90 ? 4 : gust > 70 ? 2.5 : gust > 50 ? 1 : 0;
  if (tmaxBase != null && tmaxBase > 10) sc -= 1;
  if (tminTop != null && tminTop < -18) sc -= 1;
  return { score: Math.round(clamp(sc, 0, 10) * 10) / 10, fresh, daySnow, rain, cloud, gust, tmaxBase };
}

/* =====================================================================
   2) MALLA DE EUROPA (data/grid): un archivo binario por paso de 3 h
   Cada archivo: 5 capas de enteros de 16 bits (nieve acumulada ×10,
   temperatura ×10, viento u y v ×10 en m/s, isocero en m).
   ===================================================================== */
let GM = null, G = null;
const stepCache = new Map();
function gridStepFor(key) {
  if (!GM || !key) return null;
  const target = Date.parse(key); let best = null, bd = Infinity;
  GM.times.forEach((t, i) => { const d = Math.abs(Date.parse(t) - target); if (d < bd) { bd = d; best = i; } });
  return bd <= 2 * 3600e3 ? best : null;
}
function loadStep(i) {
  if (stepCache.has(i)) return stepCache.get(i);
  const p = getFile(`data/grid/s${String(GM.steps[i]).padStart(3, "0")}.bin`, "bin").then(buf => {
    const a = new Int16Array(buf), n = G.nLat * G.nLon;
    const layer = (k, f) => { const o = new Float32Array(n); for (let j = 0; j < n; j++) { const v = a[k * n + j]; o[j] = v === GM.nodata ? NaN : v * f; } return o; };
    const u = layer(2, 0.36), v = layer(3, 0.36), ws = new Float32Array(n);    // m/s ×10 → km/h
    for (let j = 0; j < n; j++) ws[j] = Math.hypot(u[j], v[j]);
    return { snow: layer(0, 0.1), temp: layer(1, 0.1), u, v, ws, fl: layer(4, 1) };
  });
  p.catch(() => stepCache.delete(i));
  stepCache.set(i, p); return p;
}
function sample(arr, lat, lon) {
  const gy = (lat - G.S) / G.step, gx = (lon - G.W) / G.step;
  if (gy < 0 || gx < 0 || gy > G.nLat - 1 || gx > G.nLon - 1) return NaN;
  const r0 = Math.floor(gy), c0 = Math.floor(gx), r1 = Math.min(r0 + 1, G.nLat - 1), c1 = Math.min(c0 + 1, G.nLon - 1);
  const fy = gy - r0, fx = gx - c0, n = G.nLon;
  return (arr[r0*n+c0] * (1 - fx) + arr[r0*n+c1] * fx) * (1 - fy) + (arr[r1*n+c0] * (1 - fx) + arr[r1*n+c1] * fx) * fy;
}

/* =====================================================================
   3) MAPA, CAPA DE COLOR Y PARTÍCULAS
   ===================================================================== */
let layer = "snow", dotsMode = "snow", curKey = null, showParticles = true;
let CUR = null, BASE = null;            // campos de la hora elegida y de "ahora"
const map = new maplibregl.Map({
  container:"map", style:"https://tiles.openfreemap.org/styles/positron", center:[-3.5, 40.4], zoom:5.3, minZoom:3,
  attributionControl:{ compact:true, customAttribution:'Datos: <a href="https://www.ecmwf.int/en/forecasts/datasets/open-data" target="_blank">ECMWF Open Data (CC BY 4.0)</a> · <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a> · © AEMET' },
});
map.addControl(new maplibregl.NavigationControl(), "top-right");
const hoverTip = new maplibregl.Popup({ closeButton:false, closeOnClick:false, offset:12 });

const IMG_W = 760, IMG_H = 640, img = document.createElement("canvas"); img.width = IMG_W; img.height = IMG_H;
const merc = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
const invMerc = y => (2 * Math.atan(Math.exp(y)) - Math.PI / 2) * 180 / Math.PI;
let renderToken = 0;

async function renderImage() {
  if (!GM || !curKey) return;
  const token = ++renderToken, ci = gridStepFor(curKey), bi = gridStepFor(TIME[NOW]) ?? 0;
  if (ci == null) { if (map.getLayer("wx")) map.setLayoutProperty("wx", "visibility", "none"); CUR = null; return; }
  let cur, base;
  try { [cur, base] = await Promise.all([loadStep(ci), loadStep(bi)]); }
  catch (e) { console.error(e); banner("⚠️ No se pudo cargar un paso de la malla: " + e.message); return; }
  if (token !== renderToken) return;           // ya se pidió otra hora
  CUR = cur; BASE = base;
  const ctx = img.getContext("2d"), im = ctx.createImageData(IMG_W, IMG_H), sc = SCALES[layer];
  const yN = merc(G.N), yS = merc(G.S), n = G.nLat * G.nLon;
  let field;
  if (layer === "snow") { field = new Float32Array(n); for (let j = 0; j < n; j++) field[j] = Math.max(0, cur.snow[j] - base.snow[j]); }
  else field = layer === "temp" ? cur.temp : layer === "wind" ? cur.ws : cur.fl;
  for (let py = 0; py < IMG_H; py++) {
    const lat = invMerc(yN + (py + 0.5) / IMG_H * (yS - yN));
    for (let px = 0; px < IMG_W; px++) {
      const v = sample(field, lat, G.W + (px + 0.5) / IMG_W * (G.E - G.W)), o = (py * IMG_W + px) * 4;
      if (isNaN(v)) { im.data[o + 3] = 0; continue; }
      const [r, g, b] = colorAt(sc, v);
      im.data[o] = r; im.data[o + 1] = g; im.data[o + 2] = b;
      im.data[o + 3] = layer === "snow" ? (v < 0.3 ? 0 : Math.min(1, v / 2) * 200) : 150;
    }
  }
  ctx.putImageData(im, 0, 0);
  const url = img.toDataURL(), coords = [[G.W, G.N], [G.E, G.N], [G.E, G.S], [G.W, G.S]];
  if (map.getSource("wx")) { map.getSource("wx").updateImage({ url, coordinates: coords }); map.setLayoutProperty("wx", "visibility", "visible"); }
  else {
    const before = map.getStyle().layers.find(l => l.type === "symbol")?.id;
    map.addSource("wx", { type:"image", url, coordinates: coords });
    map.addLayer({ id:"wx", type:"raster", source:"wx", paint:{ "raster-opacity":0.85, "raster-fade-duration":0 } }, before);
  }
  // precarga los dos pasos siguientes para que la animación vaya fluida
  [ci + 1, ci + 2].filter(i => i < GM.times.length).forEach(i => loadStep(i));
}
let pendingRender = false;
function scheduleRender() { if (pendingRender) return; pendingRender = true; requestAnimationFrame(() => { pendingRender = false; renderImage(); }); }
function renderLegend() {
  const s = SCALES[layer], lo = s.stops[0][0], hi = s.stops[s.stops.length - 1][0];
  const grad = s.stops.map(([v, c]) => `rgb(${c}) ${((v - lo) / (hi - lo) * 100).toFixed(1)}%`).join(",");
  $("legend").innerHTML = `<b>${s.title}</b><div class="bar" style="background:linear-gradient(90deg,${grad})"></div>
    <div class="ticks">${s.ticks.map(t => `<span>${t}</span>`).join("")}</div>
    <div class="sub" style="margin-top:4px">${GM ? "ECMWF oficial 0,25° · ejecución " + GM.run.replace("T", " ") : "Capas no disponibles"}</div>`;
}

const pc = $("particles"), pctx = pc.getContext("2d");
let particles = [], moving = false;
function resizeParticles() { const d = window.devicePixelRatio || 1; pc.width = pc.clientWidth * d; pc.height = pc.clientHeight * d; pctx.setTransform(d, 0, 0, d, 0, 0); seedParticles(); }
function seedParticles() {
  const w = pc.clientWidth, h = pc.clientHeight, n = Math.min(2500, Math.round(w * h / 550));
  particles = Array.from({ length:n }, () => ({ x:Math.random() * w, y:Math.random() * h, age:Math.floor(Math.random() * 90) }));
  pctx.clearRect(0, 0, w, h);
}
function animate() {
  const w = pc.clientWidth, h = pc.clientHeight;
  if (CUR && showParticles && !moving) {
    pctx.globalCompositeOperation = "destination-in"; pctx.fillStyle = "rgba(0,0,0,0.92)"; pctx.fillRect(0, 0, w, h);
    pctx.globalCompositeOperation = "source-over";
    pctx.strokeStyle = layer === "snow" ? "rgba(30,41,59,0.7)" : "rgba(255,255,255,0.85)"; pctx.lineWidth = 1.1; pctx.beginPath();
    for (const p of particles) {
      if (p.age++ > 90) { p.x = Math.random() * w; p.y = Math.random() * h; p.age = 0; continue; }
      const ll = map.unproject([p.x, p.y]), uu = sample(CUR.u, ll.lat, ll.lng), vv = sample(CUR.v, ll.lat, ll.lng);
      if (isNaN(uu) || isNaN(vv)) { p.age = 99; continue; }
      const nx = p.x + uu * 0.045, ny = p.y - vv * 0.045;
      pctx.moveTo(p.x, p.y); pctx.lineTo(nx, ny); p.x = nx; p.y = ny;
    }
    pctx.stroke();
  }
  requestAnimationFrame(animate);
}
map.on("movestart", () => { moving = true; pctx.clearRect(0, 0, pc.clientWidth, pc.clientHeight); });
map.on("moveend", () => { moving = false; seedParticles(); });
window.addEventListener("resize", resizeParticles);

/* Puntos de estación */
function stationsGeo() {
  const t = curKey != null ? TIDX.get(curKey) : null, date = curKey ? curKey.slice(0, 10) : null;
  return { type:"FeatureCollection", features: STATIONS.map((s, i) => {
    const ds = date ? dayScore(s, date) : null;
    return { type:"Feature", id:i, geometry:{ type:"Point", coordinates:[s.lon, s.lat] },
      properties:{ idx:i, name:s.name, snow: t != null ? Math.round(s.cumSnow[t]) : 0, score: ds ? ds.score : -1 } };
  })};
}
function dotPaint() {
  if (dotsMode === "snow") {
    const e = ["step", ["get","snow"], SNOW_DOTS[0][1]]; SNOW_DOTS.slice(1).forEach(([v, c]) => e.push(v, c));
    map.setPaintProperty("st", "circle-color", e);
    map.setPaintProperty("st", "circle-radius", ["interpolate", ["linear"], ["get","snow"], 0, 6, 30, 11, 80, 17]);
  } else {
    const e = ["step", ["get","score"], "#64748b"]; SCORE_COLORS.forEach(([v, c]) => e.push(v, c));
    map.setPaintProperty("st", "circle-color", e);
    map.setPaintProperty("st", "circle-radius", ["interpolate", ["linear"], ["get","score"], 0, 6, 10, 14]);
  }
}
function addStations() {
  map.addSource("stations", { type:"geojson", data: stationsGeo() });
  map.addLayer({ id:"st", type:"circle", source:"stations", paint:{ "circle-color":"#94a3b8", "circle-radius":7,
    "circle-stroke-color":"#0f172a", "circle-stroke-width":["case", ["boolean", ["feature-state","selected"], false], 4, 1.5] }});
  map.addLayer({ id:"st-label", type:"symbol", source:"stations", minzoom:6.5,
    layout:{ "text-field":["get","name"], "text-font":["Noto Sans Regular"], "text-size":12, "text-offset":[0, 1.4], "text-anchor":"top" },
    paint:{ "text-color":"#0f172a", "text-halo-color":"#ffffff", "text-halo-width":1.5 } });
  dotPaint();
  map.on("click", "st", e => openStation(e.features[0].properties.idx));
  map.on("mouseenter", "st", e => {
    map.getCanvas().style.cursor = "pointer"; const p = e.features[0].properties;
    hoverTip.setLngLat(e.lngLat).setHTML(`<b>${p.name}</b><br>${p.snow} cm nuevos hasta la hora elegida${p.score >= 0 ? `<br>Índice de esquí: ${p.score}` : ""}`).addTo(map);
  });
  map.on("mouseleave", "st", () => { map.getCanvas().style.cursor = ""; hoverTip.remove(); });
}
function updateDots() { const s = map.getSource("stations"); if (s) s.setData(stationsGeo()); }
let selected = null;
function selectDot(i) {
  if (selected !== null) map.setFeatureState({ source:"stations", id:selected }, { selected:false });
  selected = i; if (i !== null) map.setFeatureState({ source:"stations", id:i }, { selected:true });
}
function showReadout(ll) {
  if (!CUR || !BASE) return;
  const r = $("readout"), temp = sample(CUR.temp, ll.lat, ll.lng);
  if (isNaN(temp)) { r.style.display = "none"; return; }
  const fl = sample(CUR.fl, ll.lat, ll.lng), snow = Math.max(0, sample(CUR.snow, ll.lat, ll.lng) - sample(BASE.snow, ll.lat, ll.lng));
  r.style.display = "block";
  r.innerHTML = `❄️ ${fmt(snow)} cm &nbsp; 🌡️ ${fmt(temp)} °C &nbsp; 💨 ${fmt(sample(CUR.ws, ll.lat, ll.lng))} km/h &nbsp; 0 °C a ${isNaN(fl) ? "—" : Math.round(fl / 50) * 50 + " m"}`;

map.on("mousemove", e => showReadout(e.lngLat));

/* =====================================================================
   4) BARRA DE TIEMPO (pasos de 3 h desde ahora)
   ===================================================================== */
let steps = [], playTimer = null;
function setupTime() {
  steps = []; for (let t = NOW; t < TIME.length; t += 3) steps.push(TIME[t]);
  const sl = $("slider"); sl.max = steps.length - 1; sl.value = 0;
  const days = [...new Set(steps.map(k => k.slice(0, 10)))];
  $("days").innerHTML = days.map((d, i) => `<button data-day="${d}">${i === 0 ? "Hoy" : dayName(d) + " " + d.slice(8)}</button>`).join("");
  $("days").querySelectorAll("button").forEach(b => b.onclick = () => goDay(b.dataset.day));
  sl.oninput = onTime; onTime();
}
function goDay(d) {
  let k = steps.findIndex(s => s >= d + "T12:00" && s.startsWith(d));
  if (k < 0) k = steps.findIndex(s => s.startsWith(d));
  if (k >= 0) { $("slider").value = k; onTime(); }
}
function onTime() {
  curKey = steps[+$("slider").value];
  const h = TIDX.get(curKey) - NOW, d = curKey.slice(0, 10);
  $("tlabel").innerHTML = `${dayName(d)} ${d.slice(8)} · ${curKey.slice(11)} <span class="sub">(+${h} h)</span>` + (h > 72 ? '<span class="trend">Más de 3 días: solo tendencia</span>' : "");
  $("days").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.day === d));
  scheduleRender(); updateDots();
  if (sheetMode === "rank") renderRanking();
  if (sheetMode === "station") document.querySelectorAll(".dc").forEach(c => c.classList.toggle("on", c.dataset.day === d));
}
$("play").onclick = () => {
  if (playTimer) { clearInterval(playTimer); playTimer = null; $("play").textContent = "▶"; return; }
  $("play").textContent = "❚❚";
  playTimer = setInterval(() => { const sl = $("slider"); sl.value = (+sl.value + 1) % (+sl.max + 1); onTime(); }, 800);
};

/* =====================================================================
   5) HOJA INFERIOR: estación, ranking o estado de las fuentes
   ===================================================================== */
let sheetMode = null, curStation = null, curElev = 1, rankZone = "Todas";
function openSheet(mode) { sheetMode = mode; $("sheet").classList.add("open"); document.body.classList.add("sheet-open"); }
function closeSheet() { sheetMode = null; $("sheet").classList.remove("open"); document.body.classList.remove("sheet-open"); selectDot(null); }
$("sheet-close").onclick = closeSheet;
$("btn-rank").onclick = () => { if (!STATIONS.length) return; selectDot(null); openSheet("rank"); renderRanking(); };

function renderRanking() {
  const date = curKey.slice(0, 10);
  const rows = STATIONS.map((s, i) => ({ s, i, d: dayScore(s, date) }))
    .filter(r => r.d && (rankZone === "Todas" || r.s.zone === rankZone)).sort((a, b) => b.d.score - a.d.score);

  $("sheet-body").innerHTML = `
    <div class="chips">${["Todas", ...ZONES].map(z => `<button data-z="${z}" class="${z === rankZone ? "on" : ""}">${z}</button>`).join("")}</div>
    <table class="rank"><tr><th>#</th><th>Estación</th><th>Índice</th><th>Nieve 48 h antes</th><th class="hide-m">Nieve en el día</th><th>Racha cima</th><th class="hide-m">Máx base</th></tr>
    ${rows.map((r, k) => `<tr class="row" data-i="${r.i}"><td>${k + 1}</td><td><b>${r.s.name}</b> <span class="sub">${r.s.zone}</span></td>
      <td><span class="sc" style="background:${scoreColor(r.d.score)}">${fmt(r.d.score, 1)}</span> <span class="sub">${scoreLabel(r.d.score)}</span></td>
      <td>${fmt(r.d.fresh)} cm</td><td class="hide-m">${fmt(r.d.daySnow)} cm</td>
      <td style="${r.d.gust > 70 ? "color:var(--bad);font-weight:600" : ""}">${fmt(r.d.gust)} km/h</td><td class="hide-m">${fmt(r.d.tmaxBase)} °C</td></tr>`).join("")}
    </table>${scoreNote()}`;
  $("sheet-body").querySelectorAll(".chips button").forEach(b => b.onclick = () => { rankZone = b.dataset.z; renderRanking(); });
  $("sheet-body").querySelectorAll("tr.row").forEach(tr => tr.onclick = () => openStation(+tr.dataset.i));
}
function scoreNote() {
  return `<p class="note"><b>Índice de esquí (0-10), orientativo.</b> Parte de 3 y suma hasta +4 por nieve caída en las 48 h previas (30 cm = máximo),
    +2 si hay sol (nubes &lt; 30 %) o +1 si hay claros. Resta por lluvia en pistas (−2,5), rachas en cima (&gt; 50 km/h −1, &gt; 70 −2,5, &gt; 90 −4: posibles cierres),
    calor en la base (&gt; 10 °C, −1), frío extremo en cima (&lt; −18 °C, −1) y nevada fuerte durante el día (−0,5). Horquilla de 9 a 16 h.
    <b>No sabe si la estación está abierta</b>: consulta siempre su parte oficial.</p>`;
}

function openStation(i) {
  const s = STATIONS[i]; curStation = s; selectDot(i); openSheet("station"); renderStation();
  map.easeTo({ center:[s.lon, s.lat - 0.6], zoom: Math.max(map.getZoom(), 7), duration:600 });
}
function renderStation() {
  const s = curStation, el = s.el[curElev], b = el.b, alt = s[ELEV[curElev][0]];
  const coord = s.dem == null ? `<span class="badge b-warn">Ubicación sin comprobar</span>`
    : s.coordOk ? `<span class="badge b-ok">✓ Altitud del punto coherente (${s.dem} m)</span>`
    : `<span class="badge b-bad">⚠ Revisar coordenadas: el terreno marca ${s.dem} m</span>`;
  $("sheet-title").innerHTML = `<h2>${s.name}</h2><div class="sub">${s.zone} · pistas ${s.base}–${s.top} m · ${coord}</div>`;

  const dates = [...new Set(steps.map(k => k.slice(0, 10)))];
  const cards = dates.map((d, di) => { const ds = dayScore(s, d); if (!ds) return "";
    return `<div class="dc ${di >= 3 ? "trend" : ""} ${curKey && curKey.startsWith(d) ? "on" : ""}" data-day="${d}">
      <div>${di === 0 ? "Hoy" : dayName(d) + " " + d.slice(8)}${di >= 3 ? " ~" : ""}</div>
      <div class="score" style="color:${scoreColor(ds.score)}">${fmt(ds.score, 1)}</div>
      <div class="sub">❄️ ${fmt(ds.daySnow)} cm · 💨 ${fmt(ds.gust)}</div></div>`; }).join("");

  const cols = [];
  for (let t = NOW; t < TIME.length; t += 3) {
    const t1 = Math.min(t + 2, TIME.length - 1), mid = Math.min(t + 1, TIME.length - 1);
    const vals = a => a.slice(t, t1 + 1).filter(x => x != null);
    const mx = a => { const v = vals(a); return v.length ? Math.max(...v) : null; };
    const avg = a => { const v = vals(a); return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null; };
    if (b.temp[mid] == null && b.snow[mid] == null) continue;
    cols.push({ key:TIME[t], h:t - NOW, snow:sumRange(b.snow, t, t1), rain:sumRange(b.rain, t, t1), temp:b.temp[mid], wind:mx(b.wind), gust:mx(b.gust), dir:b.dir[mid], fl:b.fl[mid], cloud:avg(b.cloud) });
  }
  const icon = c => { const hh = +c.key.slice(11, 13), night = hh < 8 || hh >= 19;
    return c.snow >= 0.3 ? "❄️" : c.rain >= 0.3 ? "🌧️" : c.cloud == null ? "·" : c.cloud > 75 ? "☁️" : c.cloud > 35 ? (night ? "☁️" : "⛅") : (night ? "🌙" : "☀️"); };
  const dayStart = (c, i) => i === 0 || c.key.slice(0, 10) !== cols[i - 1].key.slice(0, 10);
  const td = (c, i, html, style = "") => `<td class="${c.h > 72 ? "trend" : ""} ${dayStart(c, i) ? "dstart" : ""}" style="${style}">${html}</td>`;
  const dayHead = []; cols.forEach(c => { const d = c.key.slice(0, 10), l = dayHead[dayHead.length - 1]; if (l && l.d === d) l.n++; else dayHead.push({ d, n:1 }); });
  const tempStyle = v => { if (v == null) return ""; const [r, g, bb] = colorAt(SCALES.temp, v); return `background:rgba(${r},${g},${bb},.3)`; };
  const table = `<div class="tablewrap" id="tw"><table class="wx">
    <thead><tr><th class="rowh"></th>${dayHead.map(x => `<th colspan="${x.n}" class="dayh" id="d-${x.d}">${dayName(x.d)} ${x.d.slice(8)}</th>`).join("")}</tr>
    <tr><th class="rowh sub">Hora</th>${cols.map((c, i) => `<th class="sub ${c.h > 72 ? "trend" : ""} ${dayStart(c, i) ? "dstart" : ""}">${c.key.slice(11, 13)}</th>`).join("")}</tr></thead>
    <tr><td class="rowh"></td>${cols.map((c, i) => td(c, i, `<span style="font-size:16px">${icon(c)}</span>`)).join("")}</tr>
    <tr><td class="rowh">Nieve (cm)</td>${cols.map((c, i) => td(c, i, c.snow >= 0.3 ? `<b>${fmt(c.snow, c.snow < 10 ? 1 : 0)}</b>` : "", c.snow >= 0.3 ? `background:rgba(56,189,248,${Math.min(0.8, 0.2 + c.snow / 10)})` : "")).join("")}</tr>
    <tr><td class="rowh">Lluvia (mm)</td>${cols.map((c, i) => td(c, i, c.rain >= 0.3 ? fmt(c.rain, 1) : "", c.rain >= 0.3 ? "background:rgba(74,222,128,.25)" : "")).join("")}</tr>
    <tr><td class="rowh">Temp. (°C)</td>${cols.map((c, i) => td(c, i, fmt(c.temp), tempStyle(c.temp))).join("")}</tr>
    <tr><td class="rowh">Viento (km/h)</td>${cols.map((c, i) => td(c, i, `<span class="arrow" style="transform:rotate(${((c.dir ?? 0) + 180) % 360}deg)">↑</span>${fmt(c.wind)}`)).join("")}</tr>
    <tr><td class="rowh">Rachas (km/h)</td>${cols.map((c, i) => td(c, i, fmt(c.gust), c.gust >= 70 ? "color:var(--bad);font-weight:700" : c.gust >= 50 ? "color:var(--warn)" : "")).join("")}</tr>
    <tr><td class="rowh">Isocero (m)</td>${cols.map((c, i) => td(c, i, c.fl != null ? Math.round(c.fl / 50) * 50 : "—", c.fl != null && c.fl < alt ? "color:var(--accent)" : "")).join("")}</tr>
    <tr><td class="rowh">Nubes (%)</td>${cols.map((c, i) => td(c, i, fmt(c.cloud))).join("")}</tr>
  </table></div>`;

  const totals = s.models.map(id => { const m = MODELS.find(x => x.id === id) || { name:id, color:"#94a3b8" }, a = el.per[id].snow;
    return { m, total: sumRange(a, NOW + 1, a.length - 1), days: Math.round(a.slice(NOW).filter(v => v != null).length / 24) }; });
  const blendTotal = sumRange(b.snow, NOW + 1, b.snow.length - 1), maxT = Math.max(5, ...totals.map(x => x.total));
  const full = totals.filter(x => x.days >= 5).map(x => x.total);
  let agree = "";
  if (full.length >= 2) { const sp = (Math.max(...full) - Math.min(...full)) / Math.max(blendTotal, 5);
    const a = sp < 0.4 ? ["b-ok","alto"] : sp < 0.8 ? ["b-mid","medio"] : ["b-bad","bajo"]; agree = `<span class="badge ${a[0]}">Acuerdo: ${a[1]}</span>`; }
  const models = totals.map(x => `<div class="model-row"><span>${x.m.name}${x.days < 6 ? ` <span class="sub">(${x.days} d)</span>` : ""}</span>
      <div class="model-bar" style="width:${x.total / maxT * 100}%;background:${x.m.color}"></div><span class="model-val">${Math.round(x.total)} cm</span></div>`).join("");

  $("sheet-body").innerHTML = `
    <div class="tabs">${ELEV.map(([k, lab], i) => `<button data-i="${i}" class="${i === curElev ? "on" : ""}">${lab} · ${s[k]} m</button>`).join("")}</div>
    <div class="daycards">${cards}</div>
    <h3>Cada 3 horas a ${alt} m · mezcla de modelos</h3>
    ${table}
    <div class="grid2" style="margin-top:12px">
      <div class="card"><h3 style="margin-top:0">Probabilidad de nieve a ${s.ref} m</h3>${ensembleHTML(s)}</div>
      <div class="card"><h3 style="margin-top:0">Nieve por fuente a ${alt} m ${agree}</h3>${models}
        <div class="sub" style="margin-top:6px">Mezcla ponderada: <b style="color:var(--accent)">${Math.round(blendTotal)} cm</b> · nieve de las últimas 48 h (estimada): ${fmt(s.recent48)} cm</div></div>
    </div>
    ${scoreNote()}
    <p class="note"><b>Cómo se calcula.</b> Mezcla ponderada de ${MODELS.map(m => `${m.name} (${Math.round(m.w * 100)} %)`).join(", ")}.
      Los pesos se ajustan solos según lo que acierta cada fuente frente a AEMET. La lluvia o nieve se decide con la temperatura de bulbo húmedo,
      y los cm por mm de agua cambian con el frío (de 0,7 a 1,8) y el viento. "ECMWF oficial (perfil)" calcula la temperatura de cada cota con el
      perfil vertical del modelo, como hace Snow-Forecast. Columnas atenuadas = más de 72 h: tendencia. Isocero en azul = por debajo de esta cota.</p>`;
  $("sheet-body").querySelectorAll(".tabs button").forEach(bt => bt.onclick = () => { curElev = +bt.dataset.i; renderStation(); });
  $("sheet-body").querySelectorAll(".dc").forEach(c => c.onclick = () => {
    goDay(c.dataset.day); const th = document.getElementById("d-" + c.dataset.day), tw = $("tw");
    if (th && tw) tw.scrollTo({ left: th.offsetLeft - 100, behavior:"smooth" });
  });
}
function ensembleHTML(s) {

  if (!e) return `<div class="sub">No disponible en esta actualización.</div>`;
  const bar = (lab, p) => `<div class="prob"><span>${lab}</span><div class="track"><div class="fill" style="width:${p}%"></div></div><b>${p}%</b></div>`;
  return `<div class="sub">72 h desde ${e.from.slice(8, 10)}/${e.from.slice(5, 7)} ${e.from.slice(11)} · ${e.d3.n} escenarios ICON</div>

    <div class="sub">Lo más probable: ${fmt(e.d3.p50)} cm (rango ${fmt(e.d3.p10)}–${fmt(e.d3.p90)} cm)</div>
    <div class="sub" style="margin-top:8px">7 días: ${fmt(e.d7.p50)} cm (rango ${fmt(e.d7.p10)}–${fmt(e.d7.p90)} cm) · P(≥ 20 cm) ${e.d7.p20}%</div>`;
}

/* Estado de las fuentes y verificación */
function renderInfo() {
  $("sheet-title").innerHTML = `<h2>Fuentes y verificación</h2>`;
  const src = META ? META.sources : {}, ok = x => x && x.ok;
  const line = (name, x, extra = "") => `<div class="model-row" style="grid-template-columns:190px 1fr"><b>${name}</b><span>${ok(x) ? "✅ " + extra : "⚠️ " + (x ? (x.msg || JSON.stringify(x.errors || "")) : "sin datos")}</span></div>`;
  const v = VERIFS, names = Object.fromEntries(MODELS.map(m => [m.id, m.name])); names.blend = "Mezcla (lo que ves)";
  const vrows = v && v.sources ? Object.entries(v.sources).sort((a, b) => a[1].mae - b[1].mae).map(([id, x]) =>
    `<div class="vrow"><span>${names[id] || id}</span><span>${x.mae} mm</span><span>${x.bias > 0 ? "+" : ""}${x.bias} mm</span><span>${x.n}</span></div>`).join("") : "";
  $("sheet-body").innerHTML = `
    <div class="card" style="margin-top:8px">
      ${line("ECMWF Open Data (oficial)", src.ecmwf, "ejecución " + (src.ecmwf?.run || ""))}
      ${line("Open-Meteo (3 modelos)", src.openmeteo, Object.keys(src.openmeteo?.errors || {}).length ? "con avisos: " + Object.keys(src.openmeteo.errors).join(", ") : "")}
      ${line("Conjunto ICON-EPS", src.ensemble)}
      ${line("AEMET (verificación)", src.aemet, src.aemet?.msg || "")}
      <div class="sub" style="margin-top:6px">Datos generados hace ${META ? fmt(hoursAgo(META.generated), 1) : "—"} h.</div>
    </div>
    <h3>¿Cuánto acierta cada fuente? (precipitación en 24 h frente a AEMET)</h3>
    <div class="card">${v && v.n ? `<div class="vrow head"><span>Fuente</span><span>Error medio</span><span>Sesgo</span><span>Casos</span></div>${vrows}
      <div class="sub" style="margin-top:6px">${v.n} días evaluados (últimos 45). Pesos actuales: ${Object.entries(v.weights).map(([k, w]) => `${names[k] || k} ${Math.round(w * 100)} %`).join(" · ")}</div>`
      : `<div class="sub">Aún no hay días verificados. Empieza solo cuando el repositorio tenga la clave de AEMET y pasen dos días.</div>`}</div>
    <p class="note">Sesgo positivo = la fuente prevé más precipitación de la que mide AEMET. Las estaciones de AEMET en montaña suelen medir algo menos
      cuando nieva con viento, así que el sesgo real puede ser algo menor. Atribución: © AEMET · ECMWF Open Data CC BY 4.0 · Open-Meteo.</p>`;
}

/* =====================================================================
   6) ARRANQUE
   ===================================================================== */
document.querySelectorAll("#layers button[data-layer]").forEach(b => b.onclick = () => {
  document.querySelectorAll("#layers button[data-layer]").forEach(x => x.classList.toggle("on", x === b));
  layer = b.dataset.layer; renderLegend(); scheduleRender();
});
$("toggle-particles").onclick = () => { showParticles = !showParticles; $("toggle-particles").classList.toggle("on", showParticles); if (!showParticles) pctx.clearRect(0, 0, pc.clientWidth, pc.clientHeight); };
document.querySelectorAll("#dots button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#dots button").forEach(x => x.classList.toggle("on", x === b));
  dotsMode = b.dataset.dots; if (map.getLayer("st")) dotPaint();
});

map.on("load", async () => {
  requestAnimationFrame(animate);
  if (location.protocol === "file:") {
    banner("ℹ️ Esta versión lee sus datos desde GitHub Pages. Ábrela desde su dirección web (https://TU-USUARIO.github.io/…), no con doble clic.");
  }
  const [meta, st, gm, vf] = await Promise.allSettled([getFile("data/meta.json"), getFile("data/stations.json"), getFile("data/grid/meta.json"), getFile("data/verif.json")]);
  META = meta.value || null; VERIFS = vf.value || null;
  if (st.status === "fulfilled") { prepareStations(st.value); addStations(); }
  if (gm.status === "fulfilled") {
    GM = gm.value; G = { S:GM.S, W:GM.W, N:GM.N, E:GM.E, step:GM.step, nLat:GM.nLat, nLon:GM.nLon };
    map.setMaxBounds([[G.W, G.S], [G.E, G.N]]);       // el mapa no sale de la zona con datos: sin esquinas vacías
    resizeParticles();
  }
  renderLegend();
  if (STATIONS.length) setupTime();
  // Línea de estado y avisos
  const age = META ? hoursAgo(META.generated) : null;
  const bad = META ? Object.entries(META.sources).filter(([, x]) => !x.ok).map(([k]) => k) : [];
  $("status-line").innerHTML = META ? `Actualizado hace <b>${fmt(age, 0)} h</b> · ${bad.length ? "⚠️ revisar fuentes" : "fuentes OK"} · ver detalles` : "Sin datos";
  const errs = [];
  if (st.status === "rejected") errs.push("previsión de estaciones (" + st.reason.message + ")");
  if (gm.status === "rejected") errs.push("capas del mapa (" + gm.reason.message + ")");
  if (errs.length && location.protocol !== "file:") banner("⚠️ No se pudieron cargar: " + errs.join(" y ") + ". Si acabas de crear el repositorio, espera a que termine la primera ejecución en la pestaña Actions.");
  else if (age != null && age > 18) banner(`⚠️ Los datos tienen ${fmt(age, 0)} horas: puede que la actualización automática haya fallado. Revisa la pestaña Actions del repositorio.`);
});
</script>
</body>
</html>
